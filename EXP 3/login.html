<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olive & Ember | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="bootstrap-custom.css">
</head>
<body>

<!-- TASK 3: Navbar with dropdown + search input-group -->
<nav class="navbar navbar-expand-lg navbar-dark ember-navbar">
  <div class="container">
    <a class="navbar-brand" href="home.html">Olive & Ember</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="menu.html" id="menuDropdown" role="button" data-bs-toggle="dropdown">Menu</a>
          <ul class="dropdown-menu" aria-labelledby="menuDropdown">
            <li><a class="dropdown-item" href="menu.html">Full Menu</a></li>
            <li><a class="dropdown-item" href="home.html">Chef's Picks</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
      </ul>
      <form class="d-flex" role="search" onsubmit="return false;">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" placeholder="Search the menu...">
        </div>
      </form>
    </div>
  </div>
</nav>

<section id="login" class="page">
  <!-- TASK 1: container keeps the form margin-aligned at every breakpoint -->
  <div class="container">

    <!-- TASK 5: dismissible alert -->
    <div class="row justify-content-center">
      <div class="col-md-6 col-sm-12">
        <div class="alert alert-info alert-dismissible fade show ember-alert" role="alert">
          Welcome back! Please sign in to continue.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <!-- TASK 2: grid used to center + size the form box responsively -->
    <div class="row justify-content-center">
      <div class="col-md-6 col-sm-12">
        <div class="form-box">
          <h2>Login</h2>
          <form action="#">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <button type="submit" class="btn">Login</button>
          </form>
          <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
      </div>
    </div>

  </div>
</section>

<footer>
  &copy; 2026 Olive & Ember Restaurant
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
